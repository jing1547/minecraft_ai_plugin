name: Java Plugin CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'minecraft-ai-brain/**'
      - '.github/workflows/java-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'minecraft-ai-brain/**'
      - '.github/workflows/java-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        java-version: [17, 21]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('minecraft-ai-brain/**/*.gradle*', 'minecraft-ai-brain/**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Grant execute permission for gradlew
      run: chmod +x minecraft-ai-brain/gradlew
      
    - name: Validate Gradle wrapper
      uses: gradle/wrapper-validation-action@v1
      
    - name: Build with Gradle
      run: |
        cd minecraft-ai-brain
        ./gradlew build --no-daemon
        
    - name: Run tests
      run: |
        cd minecraft-ai-brain
        ./gradlew test --no-daemon
        
    - name: Generate test report
      uses: dorny/test-reporter@v1
      if: success() || failure()
      with:
        name: Java Test Results (JDK ${{ matrix.java-version }})
        path: minecraft-ai-brain/build/test-results/test/*.xml
        reporter: java-junit
        
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-java-${{ matrix.java-version }}
        path: minecraft-ai-brain/build/test-results/
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: plugin-jar-${{ matrix.java-version }}
        path: minecraft-ai-brain/build/libs/*.jar
        
    - name: Check for security vulnerabilities
      run: |
        cd minecraft-ai-brain
        ./gradlew dependencyCheckAnalyze --no-daemon
      continue-on-error: true
      
    - name: Upload security report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-report-java-${{ matrix.java-version }}
        path: minecraft-ai-brain/build/reports/
        
    - name: Cleanup Gradle Cache
      # Remove some files from the Gradle cache, so they aren't cached by GitHub Actions.
      # Restoring these files from a GitHub Actions cache might cause problems for future builds.
      run: |
        rm -f ~/.gradle/caches/modules-2/modules-2.lock
        rm -f ~/.gradle/caches/modules-2/gc.properties 