name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  create-release:
    runs-on: ubuntu-latest
    
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Get version
      id: get_version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        else
          echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        fi
        
    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.get_version.outputs.version }}
        release_name: Release ${{ steps.get_version.outputs.version }}
        body: |
          ## Changes in this Release
          
          ### 🚀 New Features
          - Add new features here
          
          ### 🐛 Bug Fixes
          - Add bug fixes here
          
          ### 📚 Documentation
          - Add documentation updates here
          
          ### 🔧 Internal Changes
          - Add internal changes here
          
          ## Installation
          
          ### Java Plugin (AI Brain)
          1. Download `minecraft-ai-brain-${{ steps.get_version.outputs.version }}.jar`
          2. Place in your server's `plugins/` directory
          3. Restart your server
          
          ### Node.js Bot (AI Body)
          1. Download `minecraft-ai-body-${{ steps.get_version.outputs.version }}.zip`
          2. Extract to your preferred location
          3. Run `npm install` to install dependencies
          4. Configure your `.env` file
          5. Run `npm start` to start the bot
          
          ## Full Changelog
          
          **Full Changelog**: https://github.com/${{ github.repository }}/compare/v${{ steps.get_version.outputs.version }}...v${{ steps.get_version.outputs.version }}
        draft: false
        prerelease: ${{ contains(steps.get_version.outputs.version, '-') }}
        
  build-java:
    runs-on: ubuntu-latest
    needs: create-release
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('minecraft-ai-brain/**/*.gradle*') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Grant execute permission for gradlew
      run: chmod +x minecraft-ai-brain/gradlew
      
    - name: Build with Gradle
      run: |
        cd minecraft-ai-brain
        ./gradlew build --no-daemon
        
    - name: Rename JAR file
      run: |
        cd minecraft-ai-brain/build/libs
        mv minecraft-ai-brain-*.jar minecraft-ai-brain-${{ needs.create-release.outputs.version }}.jar
        
    - name: Upload Java Plugin to Release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.create-release.outputs.upload_url }}
        asset_path: minecraft-ai-brain/build/libs/minecraft-ai-brain-${{ needs.create-release.outputs.version }}.jar
        asset_name: minecraft-ai-brain-${{ needs.create-release.outputs.version }}.jar
        asset_content_type: application/java-archive
        
  build-nodejs:
    runs-on: ubuntu-latest
    needs: create-release
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: minecraft-ai-body/package-lock.json
        
    - name: Install dependencies
      run: |
        cd minecraft-ai-body
        npm ci --production
        
    - name: Build TypeScript
      run: |
        cd minecraft-ai-body
        npm run build
        
    - name: Create distribution package
      run: |
        cd minecraft-ai-body
        # Create a clean distribution directory
        mkdir -p dist-release
        
        # Copy essential files
        cp -r dist/ dist-release/
        cp -r node_modules/ dist-release/
        cp package.json dist-release/
        cp package-lock.json dist-release/
        cp README.md dist-release/ 2>/dev/null || true
        
        # Create .env.example
        cat > dist-release/.env.example << 'EOF'
        # Minecraft Server Connection
        MINECRAFT_HOST=localhost
        MINECRAFT_PORT=25565
        MINECRAFT_USERNAME=AICompanion
        
        # WebSocket Configuration
        WEBSOCKET_HOST=localhost
        WEBSOCKET_PORT=8765
        
        # Optional: AI Configuration
        OPENAI_API_KEY=your_openai_api_key_here
        GOOGLE_CLOUD_CREDENTIALS=path/to/credentials.json
        EOF
        
        # Create startup script
        cat > dist-release/start.sh << 'EOF'
        #!/bin/bash
        echo "Starting Minecraft AI Body..."
        node dist/index.js
        EOF
        chmod +x dist-release/start.sh
        
        # Create Windows startup script
        cat > dist-release/start.bat << 'EOF'
        @echo off
        echo Starting Minecraft AI Body...
        node dist/index.js
        pause
        EOF
        
        # Create archive
        zip -r minecraft-ai-body-${{ needs.create-release.outputs.version }}.zip dist-release/
        
    - name: Upload Node.js Bot to Release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.create-release.outputs.upload_url }}
        asset_path: minecraft-ai-body/minecraft-ai-body-${{ needs.create-release.outputs.version }}.zip
        asset_name: minecraft-ai-body-${{ needs.create-release.outputs.version }}.zip
        asset_content_type: application/zip
        
  build-docker:
    runs-on: ubuntu-latest
    needs: create-release
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: minecraft-ai-body
        push: true
        tags: |
          ghcr.io/${{ github.repository_owner }}/minecraft-ai-body:latest
          ghcr.io/${{ github.repository_owner }}/minecraft-ai-body:${{ needs.create-release.outputs.version }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
  update-documentation:
    runs-on: ubuntu-latest
    needs: [create-release, build-java, build-nodejs]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Update README with latest version
      run: |
        sed -i 's/minecraft-ai-brain-.*\.jar/minecraft-ai-brain-${{ needs.create-release.outputs.version }}.jar/g' README.md
        sed -i 's/minecraft-ai-body-.*\.zip/minecraft-ai-body-${{ needs.create-release.outputs.version }}.zip/g' README.md
        
    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: 'docs: update README with release ${{ needs.create-release.outputs.version }}'
        title: 'Update documentation for release ${{ needs.create-release.outputs.version }}'
        body: |
          Automated update of documentation for release ${{ needs.create-release.outputs.version }}
          
          - Updated download links in README.md
          - Updated version references
        branch: docs/update-${{ needs.create-release.outputs.version }}
        delete-branch: true
        
  notify-discord:
    runs-on: ubuntu-latest
    needs: [create-release, build-java, build-nodejs]
    if: always() && needs.create-release.result == 'success'
    
    steps:
    - name: Send Discord notification
      uses: sarisia/actions-status-discord@v1
      with:
        webhook: ${{ secrets.DISCORD_WEBHOOK }}
        status: ${{ job.status }}
        title: "🚀 New Release: ${{ needs.create-release.outputs.version }}"
        description: |
          A new version of Minecraft AI Companion has been released!
          
          **Download:**
          - [Java Plugin](https://github.com/${{ github.repository }}/releases/download/${{ needs.create-release.outputs.version }}/minecraft-ai-brain-${{ needs.create-release.outputs.version }}.jar)
          - [Node.js Bot](https://github.com/${{ github.repository }}/releases/download/${{ needs.create-release.outputs.version }}/minecraft-ai-body-${{ needs.create-release.outputs.version }}.zip)
          
          **View Release:** https://github.com/${{ github.repository }}/releases/tag/${{ needs.create-release.outputs.version }}
        color: 0x28a745
        username: "GitHub Actions"
        avatar_url: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" 