name: MinecraftAICompanion
version: '${project.version}'
description: AI Companion Plugin for Minecraft with Korean Voice Interaction
author: MinecraftAI Team
website: https://github.com/minecraft-ai/companion-plugin
main: com.minecraft.ai.companion.MinecraftAICompanionPlugin

api-version: 1.20
depend: []
softdepend: []
loadbefore: []

commands:
  aicompanion:
    description: Main command for AI Companion plugin
    usage: /<command> <subcommand>
    permission: aicompanion.use
    aliases: [aic, companion]
  
  ai-spawn:
    description: Spawn an AI companion
    usage: /<command> [name]
    permission: aicompanion.spawn
    
  ai-remove:
    description: Remove AI companion
    usage: /<command>
    permission: aicompanion.remove
    
  ai-settings:
    description: Configure AI companion settings
    usage: /<command> <setting> <value>
    permission: aicompanion.settings
    
  ai-voice:
    description: Toggle voice interaction mode
    usage: /<command> [on|off]
    permission: aicompanion.voice

permissions:
  aicompanion.*:
    description: Gives access to all AI Companion features
    default: op
    children:
      aicompanion.use: true
      aicompanion.spawn: true
      aicompanion.remove: true
      aicompanion.settings: true
      aicompanion.voice: true
      aicompanion.admin: true
      
  aicompanion.use:
    description: Basic permission to use AI Companion
    default: true
    
  aicompanion.spawn:
    description: Permission to spawn AI companions
    default: true
    
  aicompanion.remove:
    description: Permission to remove AI companions
    default: true
    
  aicompanion.settings:
    description: Permission to modify AI companion settings
    default: true
    
  aicompanion.voice:
    description: Permission to use voice interaction features
    default: true
    
  aicompanion.admin:
    description: Administrative permissions for AI Companion
    default: op 