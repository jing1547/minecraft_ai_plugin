plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.8'
}

group = 'com.minecraft.ai'
version = '1.0.0-SNAPSHOT'
description = 'Minecraft AI Brain - Java Plugin Component'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// Repositories are now defined in settings.gradle

dependencies {
    // Paper API - Latest stable version that supports Java 21
    compileOnly 'io.papermc.paper:paper-api:1.20.6-R0.1-SNAPSHOT'
    
    // JSON processing
    implementation 'com.google.code.gson:gson:2.10.1'
    
    // WebSocket communication
    implementation 'org.java-websocket:Java-WebSocket:1.5.4'
    
    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation 'ch.qos.logback:logback-classic:1.4.11'
    
    // Testing
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core:5.7.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.7.0'
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs(['--enable-preview'])
}

shadowJar {
    archiveClassifier.set('')
    relocate 'com.google.gson', 'com.minecraft.ai.brain.libs.gson'
    relocate 'org.java_websocket', 'com.minecraft.ai.brain.libs.websocket'
    relocate 'ch.qos.logback', 'com.minecraft.ai.brain.libs.logback'
    relocate 'org.slf4j', 'com.minecraft.ai.brain.libs.slf4j'
    
    manifest {
        attributes(
            'Built-By': System.getProperty('user.name'),
            'Build-Timestamp': new java.text.SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss.SSSZ").format(new Date()),
            'Created-By': "Gradle ${gradle.gradleVersion}",
            'Build-Jdk': "${System.getProperty('java.version')} (${System.getProperty('java.vendor')} ${System.getProperty('java.vm.version')})",
            'Build-OS': "${System.getProperty('os.name')} ${System.getProperty('os.arch')} ${System.getProperty('os.version')}"
        )
    }
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    expand(
        'version': project.version.toString()
    )
}

compileJava {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs.addAll([
        '--enable-preview',
        '-Xlint:unchecked',
        '-Xlint:deprecation'
    ])
}

compileTestJava {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs.addAll([
        '--enable-preview'
    ])
}

jar {
    enabled = false
}

build {
    dependsOn shadowJar
}

// Task to check Java version
task checkJavaVersion {
    doLast {
        println "Java Version: ${System.getProperty('java.version')}"
        println "Java Vendor: ${System.getProperty('java.vendor')}"
        println "Gradle Version: ${gradle.gradleVersion}"
    }
} 