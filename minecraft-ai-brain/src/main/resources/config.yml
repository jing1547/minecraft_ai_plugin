# Minecraft AI Brain Plugin Configuration
# This file contains settings for the AI Brain component of the hybrid architecture

# Plugin Information
plugin:
  version: 1.0.0
  debug-mode: false
  auto-update-check: true

# WebSocket Server Configuration (Communication with Node.js Mineflayer bot)
websocket:
  # Server binding configuration
  host: "localhost"
  port: 8080
  
  # Connection management
  max-connections: 100
  connection-timeout-ms: 60000      # 60 seconds
  heartbeat-interval-ms: 30000      # 30 seconds
  
  # Server behavior
  auto-start: true
  reconnect-attempts: 3
  reconnect-delay-ms: 5000         # 5 seconds
  
  # Security
  allow-origins: ["*"]             # Configure for production
  require-authentication: false
  
  # Logging
  log-connections: true
  log-messages: false              # Set to true for debugging

# AI Configuration
ai:
  # Default AI behavior
  enabled: true
  response-timeout-ms: 30000       # 30 seconds
  max-conversation-history: 50
  
  # Voice processing (if implemented)
  voice:
    enabled: false
    stt-provider: "google"         # speech-to-text provider
    tts-provider: "google"         # text-to-speech provider
    voice-activation-threshold: 0.7

# Speech-to-Text Configuration (Google Cloud)
speech:
  enabled: true
  credentials:
    path: "minecraftsever-463307-4aca77796027.json"  # Path to Google Cloud service account JSON file
  language:
    code: "ko-KR"                  # Language code for speech recognition
  sample:
    rate: 16000                    # Audio sample rate in Hz

# Text-to-Speech Configuration (Google Cloud)
tts:
  enabled: true
  credentials:
    path: "minecraftsever-463307-4aca77796027.json"  # Path to Google Cloud service account JSON file
  voice:
    default:
      language-code: "ko-KR"
      name: "ko-KR-Neural2-C"      # Default Korean neural voice
      gender: "NEUTRAL"
    emotions:
      happy:
        name: "ko-KR-Neural2-B"
        gender: "FEMALE"
        pitch: 4.0
        speaking-rate: 1.2
      sad:
        name: "ko-KR-Neural2-D"
        gender: "MALE"
        pitch: -2.0
        speaking-rate: 0.8
      angry:
        name: "ko-KR-Neural2-A"
        gender: "MALE"
        pitch: 3.0
        speaking-rate: 1.3
      fearful:
        name: "ko-KR-Neural2-C"
        gender: "NEUTRAL"
        pitch: 1.5
        speaking-rate: 1.1
  audio:
    encoding: "MP3"                # Audio encoding format
    sample-rate: 22050             # Audio sample rate for output
  cache:
    enabled: true                  # Enable caching for frequent phrases
    max-entries: 1000              # Maximum number of cached entries
    ttl-minutes: 60                # Time to live for cache entries
  rate-limiting:
    enabled: true                  # Enable rate limiting for API calls
    requests-per-minute: 100       # Maximum requests per minute
    tokens-per-minute: 1000000     # Maximum tokens per minute
  optimization:
    ssml-enabled: true             # Enable SSML markup for enhanced expression
    auto-pause-detection: true     # Automatically add pauses for Korean text
    pronunciation-fixes: true      # Apply pronunciation fixes for gaming terms

# Audio Capture Configuration
audio:
  enabled: false
  capture:
    sample-rate: 16000             # Audio sample rate in Hz
    bits-per-sample: 16            # Bits per audio sample
    channels: 1                    # Number of audio channels (1 = mono)
    buffer-size: 4096              # Audio buffer size in bytes
  processing:
    noise-reduction: true          # Enable noise reduction
    volume-normalization: true     # Enable volume normalization
    high-pass-filter: false        # Enable high-pass filter
    voice-activity-detection: true # Enable voice activity detection
  push-to-talk:
    enabled: false                 # Enable push-to-talk functionality
    key: "V"                       # Push-to-talk key (client-side)
    hold-time: 100                 # Minimum hold time in milliseconds
  
  # Natural language processing
  nlp:
    language: "en-US"
    confidence-threshold: 0.6
    enable-context-awareness: true

# Player Interaction Settings
player-interaction:
  # Tracking configuration
  track-movements: true
  track-chat: true
  track-commands: false
  
  # Proximity detection
  interaction-radius: 10.0         # blocks
  notification-radius: 5.0         # blocks
  
  # Behavior
  auto-respond: true
  response-delay-ms: 1000          # 1 second
  max-responses-per-minute: 10

# Command Configuration
commands:
  # Default permissions
  default-permission-level: "user"
  
  # Command aliases
  enable-aliases: true
  custom-aliases:
    ai: ["companion", "aibot", "brain"]
    ai-config: ["aiconfig", "config-ai"]
  
  # Command behavior
  show-help-on-error: true
  command-cooldown-ms: 1000        # 1 second

# Data Storage
storage:
  # Database configuration (if implemented)
  type: "yaml"                     # yaml, sqlite, mysql
  
  # File storage
  save-interval-minutes: 5
  backup-enabled: true
  max-backups: 10
  
  # Data retention
  keep-logs-days: 7
  keep-interactions-days: 30

# Performance Settings
performance:
  # Threading
  max-worker-threads: 4
  task-queue-size: 100
  
  # Caching
  enable-caching: true
  cache-size: 1000
  cache-expiry-minutes: 30
  
  # Resource limits
  max-memory-mb: 256
  gc-threshold-mb: 200

# Logging Configuration
logging:
  # Log levels: DEBUG, INFO, WARN, ERROR
  level: "INFO"
  
  # Log destinations
  console: true
  file: true
  file-path: "logs/minecraft-ai-brain.log"
  
  # Log formatting
  include-timestamp: true
  include-thread-name: true
  include-logger-name: true
  
  # Log rotation
  max-file-size-mb: 10
  max-files: 5

# Integration Settings
integration:
  # Plugin compatibility
  worldguard-integration: false
  vault-integration: false
  
  # External services
  metrics-enabled: true
  update-checker-enabled: true
  
  # API endpoints (if applicable)
  external-api:
    enabled: false
    base-url: ""
    api-key: ""
    timeout-ms: 10000

# Development Settings (for debugging)
development:
  # Testing features
  mock-ai-responses: false
  simulate-delays: false
  
  # Debug information
  verbose-logging: false
  dump-messages: false
  profile-performance: false
  
  # Safety features
  safe-mode: false
  disable-external-connections: false 